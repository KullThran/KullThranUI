name: Publicar Addon y Notificar

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Clonar repositorio
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Extraer la última versión del CHANGELOG
        shell: bash
        run: |
          changelog_file="KullThranUI/CHANGELOG.md"
          changelog_tmp="$RUNNER_TEMP/kullthranui-latest-changelog.md"
          awk '
            /^## [0-9]+\.[0-9]+\.[0-9]+([[:space:]]|$)/ {
              if (found) exit
              found=1
              next
            }
            /^- [0-9]+\.[0-9]+\.[0-9]+([[:space:]]|$)/ {
              if (found) exit
            }
            found && /^- (KullThranUI Changelog|Current addon version|Primary source|Secondary source)/ { next }
            found && /^- [0-9]+\.[0-9]+\.[0-9]+ \([0-9]+-[0-9]+-[0-9]+\)/ { next }
            found { print }
          ' "$changelog_file" > "$changelog_tmp"

          if [[ ! -s "$changelog_tmp" ]]; then
            echo "No se encontró una sección de versión en $changelog_file." >&2
            exit 1
          fi

          # Discord allows 2000 characters per message.  Truncate if needed.
          max_chars=1900
          content=$(cat "$changelog_tmp")
          if [[ ${#content} -gt $max_chars ]]; then
            content="${content:0:$max_chars}"
            content="${content%$'\n'*}"
            content="$content
            …(truncated)"
          fi

          delimiter="CHANGELOG_$(uuidgen)"
          {
            echo "CHANGELOG<<$delimiter"
            echo "$content"
            echo "$delimiter"
          } >> "$GITHUB_ENV"

      - name: Empaquetar y subir a Curse y Wago
        uses: BigWigsMods/packager@v2
        with:
          args: '-n "{package-name} {project-version}:{package-name} {project-version}"'
        env:
          CF_API_KEY: ${{ secrets.CF_API_KEY }}
          WAGO_API_TOKEN: ${{ secrets.WAGO_API_TOKEN }}
          GITHUB_OAUTH: ${{ secrets.GITHUB_TOKEN }}

      - name: Notificar a Discord
        uses: Ilshidur/action-discord@master
        env:
          DISCORD_WEBHOOK: ${{ secrets.DISCORD_WEBHOOK }}
        with:
          args: |
            @everyone
            ${{ env.CHANGELOG }}