name: Publicar Addon y Notificar

on:
  push:
    tags:
      - 'v*' # Se activará solo al crear tags como "v5.0.7"

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Clonar repositorio
        uses: actions/checkout@v3
        with:
          fetch-depth: 0

      - name: Empaquetar y subir a Curse y Wago
        uses: BigWigsMods/packager@v2
        env:
          CF_API_KEY: ${{ secrets.CF_API_KEY }}
          WAGO_API_TOKEN: ${{ secrets.WAGO_API_TOKEN }}
          GITHUB_OAUTH: ${{ secrets.GITHUB_TOKEN }}

      - name: Notificar a Discord
        uses: Ilshidur/action-discord@master
        env:
          DISCORD_WEBHOOK: ${{ secrets.DISCORD_WEBHOOK }}
        with:
          args: |
            🚨 **KullThranUI Updated!** 🚨
            
            Version **${{ github.ref_name }}** has just been released.
            The addon is now available to download on CurseForge and Wago.