name: Publicar Addon y Notificar

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Clonar repositorio
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Extraer la última versión del CHANGELOG
        shell: bash
        run: |
          changelog_file="KullThranUI/CHANGELOG.md"
          changelog_tmp="$RUNNER_TEMP/kullthranui-latest-changelog.md"
          awk '
            /^## [0-9]+\.[0-9]+\.[0-9]+([[:space:]]|$)/ {
              if (found) exit
              found=1
            }
            found { print }
          ' "$changelog_file" > "$changelog_tmp"

          if [[ ! -s "$changelog_tmp" ]]; then
            echo "No se encontró una sección de versión en $changelog_file." >&2
            exit 1
          fi

          delimiter="CHANGELOG_$(uuidgen)"
          {
            echo "CHANGELOG<<$delimiter"
            cat "$changelog_tmp"
            echo "$delimiter"
          } >> "$GITHUB_ENV"
      - name: Normalizar tag de version
        shell: bash
        run: |
          version="${GITHUB_REF_NAME#v}"
          if [[ "$version" == "$GITHUB_REF_NAME" ]]; then
            echo "Los tags de release deben usar el formato v<version>." >&2
            exit 1
          fi
          git tag --delete "$GITHUB_REF_NAME"
          git tag "$version" "$GITHUB_SHA"
      - name: Empaquetar y subir a Curse y Wago
        uses: BigWigsMods/packager@v2
        env:
          CF_API_KEY: ${{ secrets.CF_API_KEY }}
          WAGO_API_TOKEN: ${{ secrets.WAGO_API_TOKEN }}
          GITHUB_OAUTH: ${{ secrets.GITHUB_TOKEN }}

      - name: Notificar a Discord
        uses: Ilshidur/action-discord@master
        env:
          DISCORD_WEBHOOK: ${{ secrets.DISCORD_WEBHOOK }}
        with:
          args: |
            🚨 **@everyone KullThranUI Updated! (Version ${{ github.ref_name }})** 🚨
            
            **Changelog:**
            ${{ env.CHANGELOG }}
            
            📥 *The addon is now available to download on CurseForge and Wago.*