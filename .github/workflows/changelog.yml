name: Notificar changelog publicado
run-name: Changelog ${{ inputs.release_tag }}

on:
  workflow_dispatch:
    inputs:
      release_tag:
        description: 'Published release tag to announce (no package uploads)'
        required: true
        type: string
        default: v5.1.3

permissions:
  contents: read

jobs:
  notify:
    runs-on: ubuntu-latest
    steps:
      - name: Send the published changelog to Discord
        shell: bash
        env:
          RELEASE_TAG: ${{ inputs.release_tag }}
          GH_TOKEN: ${{ github.token }}
          DISCORD_WEBHOOK: ${{ secrets.DISCORD_WEBHOOK }}
        run: |
          set -euo pipefail
          [[ "$RELEASE_TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+(-beta|-alpha)?$ ]]
          test -n "$DISCORD_WEBHOOK"
          curl --fail --silent --show-error \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H 'Accept: application/vnd.github+json' \
            "https://api.github.com/repos/$GITHUB_REPOSITORY/releases/tags/$RELEASE_TAG" \
            -o "$RUNNER_TEMP/release.json"
          jq -e '.draft == false and (.body | length > 0)' \
            "$RUNNER_TEMP/release.json" > /dev/null
          jq '{content: ("@everyone\n" +
            (if (.body | length) > 1750 then (.body[0:1750] + "\n...") else .body end) +
            "\n" + .html_url), allowed_mentions: {parse: ["everyone"]}}' \
            "$RUNNER_TEMP/release.json" > "$RUNNER_TEMP/discord-changelog.json"
          jq -e '.content | length <= 2000' "$RUNNER_TEMP/discord-changelog.json" > /dev/null
          if [[ "$DISCORD_WEBHOOK" == *'?'* ]]; then
            webhook_url="$DISCORD_WEBHOOK&wait=true"
          else
            webhook_url="$DISCORD_WEBHOOK?wait=true"
          fi
          curl --fail --silent --show-error \
            -H 'Content-Type: application/json' \
            --data-binary "@$RUNNER_TEMP/discord-changelog.json" \
            "$webhook_url" -o "$RUNNER_TEMP/discord-receipt.json"
          jq -e '.id and .channel_id' "$RUNNER_TEMP/discord-receipt.json" > /dev/null
          echo "Discord confirmed the changelog announcement for $RELEASE_TAG."
